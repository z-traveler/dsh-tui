name: Private downstream release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable downstream tag to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: downstream-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}
  DSH_TUI_LANG: zh
  DSH_TUI_SPLASH_FONT: bold
  TERM: xterm-256color
  COLORTERM: truecolor

jobs:
  build:
    if: github.repository == 'z-traveler/dsh-tui'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      artifact: ${{ steps.package.outputs.artifact }}
    steps:
      - name: Validate tag
        shell: bash
        run: '[[ "$RELEASE_TAG" =~ ^z-[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - run: pnpm verify:package
      - run: pnpm verify:bun-package
      - run: node scripts/verify-installer-bundle.mjs
      - name: Full regression groups
        run: |
          for group in render-scroll input-terminal session-workspace channel-ui; do
            node scripts/run-ci-group.mjs "$group" || exit "$?"
          done
      - name: Downstream regressions
        run: |
          for script in verify-hud.tsx verify-powerline-input.tsx verify-powerline-layout.ts verify-powerline-git.ts verify-subscription-display.ts verify-model-icon.ts verify-model-icon-width.ts; do
            node --import tsx/esm "scripts/downstream/$script" || exit "$?"
          done
      - name: Package tested source
        id: package
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          VERSION=$(node -p "require('./package.json').version")
          test "$RELEASE_TAG" = "z-$VERSION.${RELEASE_TAG##*.}"
          OUT="$RUNNER_TEMP/downstream"
          mkdir -p "$OUT"
          node scripts/with-publish-manifest.mjs npm pack --ignore-scripts --pack-destination "$OUT"
          git diff --exit-code
          export SOURCE_COMMIT=$(git rev-parse HEAD)
          node --input-type=module <<'JS'
          import fs from 'node:fs'
          const metadata = {
            repository: process.env.GITHUB_REPOSITORY,
            tag: process.env.RELEASE_TAG,
            commit: process.env.SOURCE_COMMIT,
            workflowCommit: process.env.GITHUB_WORKFLOW_SHA,
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
          }
          fs.writeFileSync(process.env.RUNNER_TEMP + '/downstream/RELEASE.json', JSON.stringify(metadata, null, 2) + '\n')
          JS
          (cd "$OUT" && sha256sum *.tgz RELEASE.json > SHA256SUMS)
          echo "artifact=downstream-package-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: ${{ runner.temp }}/downstream/*
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: package
      - name: Publish to this private repository only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh repo view "$GITHUB_REPOSITORY" --json isPrivate --jq .isPrivate)" = true
          (cd package && sha256sum -c SHA256SUMS)
          gh release create "$RELEASE_TAG" package/*.tgz package/RELEASE.json package/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG" \
            --notes "CI-built private downstream. Source and workflow commits, run ID and checksums are included. No npm publication."
